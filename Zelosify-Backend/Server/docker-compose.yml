name: zelosify-local
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: zelosify
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Run npm run setup:local first}
      POSTGRES_DB: zelosify
    ports: ["127.0.0.1:5445:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zelosify -d zelosify"]
      interval: 3s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run npm run setup:local first}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./.local/realms:/opt/keycloak/data/import:ro
    command: ["start-dev", "--http-relative-path=/auth", "--import-realm"]
volumes:
  postgres_data:
  keycloak_data:
