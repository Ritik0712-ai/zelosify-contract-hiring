name: Verify assignment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zelosify
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: zelosify_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U zelosify -d zelosify_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://zelosify:ci-only-disposable-password@localhost:5432/zelosify_test?schema=public
      AI_WORKER_ENABLED: 'false'
    defaults:
      run:
        working-directory: Zelosify-Backend/Server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Zelosify-Backend/Server/package-lock.json
      - run: npm ci
      - run: npm run prisma:deploy
      - run: npm run build
      - run: npm test -- --run
      - run: npm audit --omit=dev --audit-level=high
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:5050/api/v1
    defaults:
      run:
        working-directory: Zelosify-Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Zelosify-Frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
